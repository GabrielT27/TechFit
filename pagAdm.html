    <h1 class="tec" style="margin-bottom: 95px; margin-top: 30px; text-align: center;">PAINEL ADMNISTRATIVO</h1>
    <!-- From Uiverse.io by Vosoone --> 
<div class="crypto-card">
  <div class="header">
    <span class="logo">CryptoApp</span>
    <span class="open">Open App →</span>
  </div>

  <fieldset class="crypto-switch">
    <input type="radio" id="bitcoin" name="crypto" checked="" />
    <label for="bitcoin"> JUN </label>

    <input type="radio" id="ethereum" name="crypto" />
    <label for="ethereum"> JUL </label>

    <input type="radio" id="solana" name="crypto" />
    <label for="solana"> AGO </label>

    <input type="radio" id="tether" name="crypto" />
    <label for="tether"> SET </label>

    <div class="slider"></div>
  </fieldset>

  <div class="price-infos">
    <div class="price-info bitcoin" id="bitcoin-info">
      <div class="price">$57,256.15</div>
      <div class="stats">
        <span class="amount">12.458 BTC</span>
        <span class="change">+10.4%</span>
      </div>
    </div>

    <div class="price-info ethereum" id="ethereum-info">
      <div class="price">$3,452.12</div>
      <div class="stats">
        <span class="amount">34.123 ETH</span>
        <span class="change">+8.2%</span>
      </div>
    </div>

    <div class="price-info solana" id="solana-info">
      <div class="price">$145.78</div>
      <div class="stats">
        <span class="amount">150.78 SOL</span>
        <span class="change">+12.1%</span>
      </div>
    </div>

    <div class="price-info tether" id="tether-info">
      <div class="price">$1.00</div>
      <div class="stats">
        <span class="amount">10,000 TET</span>
        <span class="change">+0.0%</span>
      </div>
    </div>
  </div>

  <div class="chart">
    <svg id="chart-bitcoin" viewBox="0 0 100 50" preserveAspectRatio="none">
      <path
        d="M0,48 L5,45 L10,42 L15,38 L20,40 L25,35 L30,32 L35,28 L40,30 L45,25 L50,28 L55,22 L60,25 L65,20 L70,23 L75,18 L80,20 L85,15 L90,18 L95,12 L100,15, L 100 190"
      ></path>
    </svg>

    <svg id="chart-ethereum" viewBox="0 0 100 40" preserveAspectRatio="none">
      <path
        d="M0,40 L5,38 L10,36 L15,34 L20,32 L25,30 L30,28 L35,26 L40,24 L45,22 L50,20 L55,22 L60,18 L65,20 L70,15 L75,18 L80,14 L85,16 L90,12 L95,14 L100,10, L 100 190"
      ></path>
    </svg>

    <svg id="chart-solana" viewBox="0 0 100 38" preserveAspectRatio="none">
      <path
        d="M0,35 L5,33 L10,31 L15,29 L20,27 L25,25 L30,23 L35,21 L40,19 L45,18 L50,16 L55,15 L60,14 L65,12 L70,11 L75,10 L80,9 L85,8 L90,7 L95,6 L100,5, L 100 190"
      ></path>
    </svg>

    <svg
      id="chart-tether"
      viewBox="0 0 100 50"
      preserveAspectRatio="none"
      fill="none"
    >
      <path
        d="M0,25 L5,25 L10,25 L15,25 L20,25 L25,25 L30,25 L35,25 L40,25 L45,25 L50,25 L55,25 L60,25 L65,25 L70,25 L75,25 L80,25 L85,25 L90,25 L95,25 L100,25,"
      ></path>
    </svg>
  </div>
